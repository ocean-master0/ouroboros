services:
  - type: web
    name: ouroboros-api
    runtime: rust
    buildCommand: cargo build --release
    startCommand: ./target/release/ouroboros
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ouroboros-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: RUST_LOG
        value: ouroboros=info,tower_http=warn
      - key: MAX_DB_CONNECTIONS
        value: 20
      - key: LOG_LEVEL
        value: info

databases:
  - name: ouroboros-db
    databaseName: ouroboros
    user: ouroboros_user
    plan: free
