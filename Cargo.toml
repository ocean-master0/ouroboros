[package]
name = "ouroboros-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "ouroboros_api"
path = "src/lib.rs"

[[bin]]
name = "ouroboros"
path = "src/main.rs"

[dependencies]
# HTTP Core
axum       = { version = "0.8", features = ["ws", "macros"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
tower      = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "normalize-path", "limit", "timeout"] }
hyper      = { version = "1", features = ["full"] }
hyper-util = { version = "0.1" }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }

# Utilities
uuid        = { version = "1", features = ["v4", "fast-rng", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
bytes       = "1"
dotenvy     = "0.15"
thiserror   = "1"
anyhow      = "1"
num_cpus    = "1"
parking_lot = "0.12"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# HTTP client (bench engine, loopback mode)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.bench]
inherits = "release"
debug    = 1
